<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 8.1 - Kiểm tra JavaScript</title>
</head>
<body>
  <h1>Exercise 8.1: Kiểm tra JavaScript</h1>
  <p id="result"></p>
  <noscript><p>JavaScript đang tắt (You have JavaScript disabled).</p></noscript>
  <script>
    document.getElementById('result').textContent =
      'JavaScript đang bật (You have JavaScript enabled).';
  </script>
</body>
</html>
